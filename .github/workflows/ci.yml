name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace --all-targets
      - name: test (unit)
        shell: bash
        run: python3 scripts/run_tests.py
        env:
          HOUYICODER_FAST_TOKENS: "1"
      - name: test (integration)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/run_tests.py --full
        env:
          HOUYICODER_FAST_TOKENS: "1"
      - name: L2 Python gates
        if: runner.os == 'Linux'
        shell: bash
        run: CHECK_SKIP_RUST=1 bash scripts/check_code.sh
        env:
          HOUYICODER_FAST_TOKENS: "1"
      - name: L3 Structure facts
        if: runner.os == 'Linux'
        run: python3 scripts/report_structure_facts.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Generate coverage
        run: cargo llvm-cov nextest --workspace --codecov --output-path codecov.json
        env:
          HOUYICODER_FAST_TOKENS: "1"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          fail_ci_if_error: true
