name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

# Supersede stale runs: a newer commit on the same ref cancels the in-flight
# run, so consecutive pushes do not pile up a queue of obsolete jobs. Push
# CI runs only on dev (main only fast-forwards to a SHA dev already ran),
# so nothing here is a release verdict that must run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --locked --workspace --all-targets
      - name: test (unit)
        shell: bash
        run: python3 scripts/run_tests.py
        env:
          HOUYICODER_FAST_TOKENS: "1"
          GATE_SECS: "120"
      - name: test (integration)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/run_tests.py --full
        env:
          HOUYICODER_FAST_TOKENS: "1"
          GATE_SECS: "300"
      - name: L2 Python gates
        if: runner.os == 'Linux'
        shell: bash
        run: CHECK_SKIP_RUST=1 bash scripts/check_code.sh
        env:
          HOUYICODER_FAST_TOKENS: "1"
      - name: L3 Structure facts
        if: runner.os == 'Linux'
        run: python3 scripts/report_structure_facts.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the diff-coverage gate below diffs against
      # origin/main, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # llvm-tools-preview is NOT requested here: rust-toolchain.toml pins the
      # channel and overrides whatever this action makes default, so a
      # component installed for "stable" would land on the wrong toolchain the
      # moment stable moves past the pin. The pin carries the component list.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Whole-workspace unit coverage, one instrumented pass. The lcov it
      # writes is reused by the diff gate below, so the two gates cost one
      # compile between them, not two. cargo-llvm-cov is installed above, so
      # the script's skip-if-missing path cannot silently pass here.
      - name: Coverage gate (workspace total)
        run: bash scripts/check_coverage.sh
        env:
          HOUYICODER_FAST_TOKENS: "1"
          # Skip the kernel fence, not the session: see run_tests.py. Set here
          # too because this job drives the instrumented run directly.
          HOUYICODER_SANDBOX_NO_ENFORCE: "1"
      # Blocking gate on NEW code: percent of the lines this branch adds or
      # modifies that unit tests cover. Reuses the lcov from the step above.
      - name: Coverage gate (new lines)
        run: python3 scripts/check_diff_coverage.py
        env:
          COV_BASE: origin/main
          HOUYICODER_FAST_TOKENS: "1"
          HOUYICODER_SANDBOX_NO_ENFORCE: "1"
      # always(): the report is worth publishing precisely when a gate above
      # failed, since that is when someone needs to see which lines are bare.
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: YiLabsAI/HouYiCoder
          files: target/cov/houyi-cov.lcov
          fail_ci_if_error: false
