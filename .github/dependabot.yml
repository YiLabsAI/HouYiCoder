version: 2
updates:
  # Rust crates: security patches + version bumps from crates.io.
  # target-branch is dev, not the default branch (main): dependency bumps
  # must flow dev -> CI -> fast-forward to main like any other change. A PR
  # merged straight into main would leave main ahead of dev and break the
  # next fast-forward.
  # Cargo dependency bumps are managed manually for now: most pending updates
  # are major (breaking) versions that need deliberate review, and an auto-PR
  # per crate floods the PR list and burns 3-OS CI runs. Set the limit to 0
  # to stop version-update PRs; re-enable by raising the limit when the deps
  # are brought current.
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: keep workflow action pins current; stale action pins are
  # a supply-chain vector too. Same dev-target + batching rationale.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
