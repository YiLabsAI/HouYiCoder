# cargo-deny config. Run: make deny (requires `cargo install cargo-deny`).
# Verified pattern against tikv (which references deny.toml for RUSTSEC).

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots ships Mozilla's root-certificate set under a permissive
    # data license (certificate data, not code).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace-internal path deps carry no version field, which this lint
# reports as wildcards; Cargo.lock already pins every version, so allow.
wildcards = "allow"
