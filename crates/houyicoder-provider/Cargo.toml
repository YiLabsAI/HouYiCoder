[package]
name = "houyicoder-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-config = { path = "../houyicoder-config" }
houyicoder-api = { path = "../houyicoder-api" }
houyicoder-async = { path = "../houyicoder-async" }
houyicoder-protocol = { path = "../houyicoder-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
httpdate = "1"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
pollster = "1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
wiremock = "0.6"
serde_json = "1"
