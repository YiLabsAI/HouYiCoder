[package]
name = "houyicoder-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-protocol = { path = "../houyicoder-protocol" }
houyicoder-async = { path = "../houyicoder-async" }
houyicoder-resilience = { path = "../houyicoder-resilience" }
houyicoder-api = { path = "../houyicoder-api" }
houyicoder-context = { path = "../houyicoder-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
similar = "3"
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["rt", "sync", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
glob = "0.3"
walkdir = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
pollster = "0.4"
reflink-copy = { version = "0.1.30", default-features = false }
tracing = "0.1.44"
dunce = "1"

[dev-dependencies]
houyicoder-session = { path = "../houyicoder-session" }
houyicoder-sandbox = { path = "../houyicoder-sandbox" }
houyicoder-memory = { path = "../houyicoder-memory" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "process", "io-util"] }
