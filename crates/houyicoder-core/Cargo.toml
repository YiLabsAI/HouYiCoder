[package]
name = "houyicoder-core"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "core_all"
path = "tests/core_all.rs"

[[test]]
name = "reward_baseline"
path = "tests/reward_baseline.rs"

[[test]]
name = "recall_benchmark"
path = "tests/recall_benchmark.rs"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-protocol = { path = "../houyicoder-protocol" }
houyicoder-async = { path = "../houyicoder-async" }
houyicoder-resilience = { path = "../houyicoder-resilience" }
houyicoder-api = { path = "../houyicoder-api" }
houyicoder-context = { path = "../houyicoder-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
similar = "3"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["rt", "sync", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
glob = "0.3"
walkdir = "2"
regex = "1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "macos-system-configuration"] }
pollster = "1"
reflink-copy = { version = "0.1.30", default-features = false }
tracing = "0.1.44"
dunce = "1"
unicode-normalization = "0.1"

[dev-dependencies]
houyicoder-session = { path = "../houyicoder-session" }
houyicoder-sandbox = { path = "../houyicoder-sandbox" }
houyicoder-memory = { path = "../houyicoder-memory" }
houyicoder-provider = { path = "../houyicoder-provider" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "process", "io-util"] }
# A local HTTP endpoint for the prefix-reuse suite: the provider under test has
# to post real bytes somewhere, and the endpoint has to answer with a usage
# object that reports what it recognized. Test-only; the same version the
# provider crate already uses.
wiremock = "0.6"
