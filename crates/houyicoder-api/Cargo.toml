[package]
name = "houyicoder-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-protocol = { path = "../houyicoder-protocol" }
houyicoder-context = { path = "../houyicoder-context" }
houyicoder-async = { path = "../houyicoder-async" }
async-stream = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "macros"] }
tracing = "0.1.44"
dunce = "1"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# The launcher starts each command in its own process group so a wrapper it
# started cannot outlive it. Already in the workspace graph.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
