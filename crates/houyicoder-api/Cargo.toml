[package]
name = "houyicoder-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-protocol = { path = "../houyicoder-protocol" }
houyicoder-context = { path = "../houyicoder-context" }
houyicoder-async = { path = "../houyicoder-async" }
async-stream = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "macros"] }
tracing = "0.1.44"
dunce = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
