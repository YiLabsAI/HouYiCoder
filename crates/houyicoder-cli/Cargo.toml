[package]
name = "houyicoder-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "houyi"
path = "src/main.rs"

[dependencies]
houyicoder-tui = { path = "../houyicoder-tui" }
houyicoder-service = { path = "../houyicoder-service" }
houyicoder-client = { path = "../houyicoder-client" }
houyicoder-core = { path = "../houyicoder-core" }
houyicoder-context = { path = "../houyicoder-context" }
houyicoder-api = { path = "../houyicoder-api" }
houyicoder-protocol = { path = "../houyicoder-protocol" }
houyicoder-permission = { path = "../houyicoder-permission" }
houyicoder-config = { path = "../houyicoder-config" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[dev-dependencies]
houyicoder-memory = { path = "../houyicoder-memory" }
houyicoder-session = { path = "../houyicoder-session" }
pollster = "1.0"
[lints]
workspace = true
