[package]
name = "houyicoder-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "houyi-load"
path = "src/main.rs"

[dependencies]
houyicoder-context = { path = "../houyicoder-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# One timestamp parse (RFC 3339 to unix milliseconds). The timestamp crate
# already sits in the workspace graph through other dependencies; parsing is
# the only feature this crate needs.
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
