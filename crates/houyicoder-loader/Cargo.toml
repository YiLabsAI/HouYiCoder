[package]
name = "houyicoder-loader"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "houyi-load"
path = "src/main.rs"

[dependencies]
houyicoder-context = { path = "../houyicoder-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
