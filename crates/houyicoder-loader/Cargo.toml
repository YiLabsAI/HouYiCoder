[package]
name = "houyicoder-loader"
version.workspace = true
edition.workspace = true

[[bin]]
name = "houyi-load"
path = "src/main.rs"

[dependencies]
houyicoder-context = { path = "../houyicoder-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
