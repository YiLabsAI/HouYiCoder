[package]
name = "houyicoder-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-context = { path = "../houyicoder-context" }
houyicoder-api = { path = "../houyicoder-api" }
houyicoder-async = { path = "../houyicoder-async" }
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
houyicoder-memory = { path = "../houyicoder-memory" }
tokio = { version = "1", features = ["rt", "macros"] }
