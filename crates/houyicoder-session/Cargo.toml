[package]
name = "houyicoder-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
houyicoder-context = { path = "../houyicoder-context" }
houyicoder-api = { path = "../houyicoder-api" }
houyicoder-protocol = { path = "../houyicoder-protocol" }
houyicoder-async = { path = "../houyicoder-async" }
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
houyicoder-config = { path = "../houyicoder-config" }
houyicoder-memory = { path = "../houyicoder-memory" }
# rt-multi-thread lets the conditional-append test drive real concurrent
# writers, so the one-writer guarantee is proven against interleaving.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
